</head>
<body class="lore-body">

  <main class="lore-main">
    <div class="lore-container">
      <div class="lore-image-box">
        <img id="hero-img" src="" alt="Герой" class="lore-img">
      </div>

      <div class="lore-content-box">
        <h1 class="lore-title" id="hero-name">Загрузка...</h1>
        <div class="lore-badge">История персонажа</div>
        
        <div class="lore-text" id="hero-lore-content">
        </div>
        
        <a href="index.html" class="btn back-btn">Вернуться к героям</a>
      </div>

    </div>
  </main>

  <script>
    const loreDatabase = [
      { name: "Abaddon", file: "abaddon", text: "Лорд Авернуса, некогда служивший Свету, теперь черпает силу из тьмы. Он носит проклятый меч, который дарует ему неуязвимость, но медленно пожирает его душу." },
      { name: "Alchemist", file: "alchemist", text: "Алхимик — гений, который превращает обычные предметы в золото. Его жажда богатства безгранична, и он готов продать что угодно, даже собственную кровь." },
      { name: "Ancient Apparition", file: "ancient_apparition", text: "Древнее существо из ледяных пустошей, несущее холод и смерть. Оно не знает пощады и замораживает всё живое одним прикосновением." },
      { name: "Anti-Mage", file: "antimage", text: "Последний из монахов-воинов, чей орден был уничтожен магами. Он поклялся стереть магию с лица земли и сжигает ману своих врагов." },
      { name: "Arc Warden", file: "arc_warden", text: "Древний страж, застрявший между временем и пространством. Он создаёт копии самого себя, чтобы защищать мир от хаоса." },
      { name: "Axe", file: "axe", text: "Могучий Могул Кхан, известный как Акс, не знает пощады. Он прорубает себе путь сквозь ряды врагов, ища достойного противника и вечную славу. Его ярость не знает границ, а топор жаждет крови." },
      { name: "Bane", file: "bane", text: "Дитя ночных кошмаров, рождённое из тёмных снов. Он насылает на врагов ужас и заставляет их спать вечным сном." },
      { name: "Batrider", file: "batrider", text: "Безумный наездник на летучей мыши, который обожает огонь и хаос. Он поливает врагов горючей смесью и тащит их прямо в лапы своей команды." },
      { name: "Beastmaster", file: "beastmaster", text: "Повелитель зверей, который вырос в диких лесах. Он призывает на помощь своих верных зверей и видит всё, что происходит на карте." },
      { name: "Bloodseeker", file: "bloodseeker", text: "Страж, одержимый жаждой крови. Он чувствует раненых врагов на расстоянии и бежит за ними, чтобы завершить начатое." },
      { name: "Bounty Hunter", file: "bounty_hunter", text: "Охотник за головами, который всегда выполняет контракт. Он выслеживает врагов, снимает с них скальпы и получает за это щедрую награду." },
      { name: "Brewmaster", file: "brewmaster", text: "Мудрый панда-монах, который любит пиво и драки. В бою он разделяется на трёх духов, каждый из которых владеет своим стилем боя." },
      { name: "Bristleback", file: "bristleback", text: "Суровый воин, чья спина покрыта острыми шипами. Он не боится боли и становится только сильнее, когда враги бьют его в спину." },
      { name: "Broodmother", file: "broodmother", text: "Королева пауков, которая плетёт сети и плодит армии своих детей. Она захватывает территорию и не отпускает свою добычу." },
      { name: "Centaur Warrunner", file: "centaur", text: "Беспощадный воин-кентавр, который любит давить врагов копытами. Он впитывает урон и отвечает сокрушительным ударом." },
      { name: "Chaos Knight", file: "chaos_knight", text: "Рыцарь хаоса, который пришёл из другого измерения. Он создаёт иллюзии и сеет хаос на поле боя." },
      { name: "Chen", file: "chen", text: "Святой пастырь, который подчиняет себе диких зверей. Он ведёт свою армию в бой и лечит союзников." },
      { name: "Clinkz", file: "clinkz", text: "Скелет-лучник, который продал душу за силу. Он стреляет из лука и сжигает врагов огнём." },
      { name: "Clockwerk", file: "rattletrap", text: "Безумный изобретатель в бронекостюме. Он запирает врагов в коконе и разбирает их на запчасти." },
      { name: "Crystal Maiden", file: "crystal_maiden", text: "Райлай, маг льда, пришла из далёких северных земель. Она ищет пропавшего брата и замораживает всех на своём пути." },
      { name: "Dark Seer", file: "dark_seer", text: "Тёмный провидец, который манипулирует пространством. Он создаёт копии врагов и разгоняет союзников в бою." },
      { name: "Dark Willow", file: "dark_willow", text: "Озорная фея, которая любит пугать людей. Она кидает врагов в кусты и связывает их магией." },
      { name: "Dawnbreaker", file: "dawnbreaker", text: "Воин света, которая несёт справедливость. Она летает на помощь союзникам и лечит их в бою." },
      { name: "Dazzle", file: "dazzle", text: "Жрец, который спасает от смерти. Он лечит союзников и даёт им шанс на вторую жизнь." },
      { name: "Death Prophet", file: "death_prophet", text: "Пророчица смерти, которая общается с духами. Она призывает их на поле боя, чтобы разрушить башни врагов." },
      { name: "Disruptor", file: "disruptor", text: "Громовой маг, который контролирует погоду. Он блокирует врагов куполом и возвращает их на место." },
      { name: "Doom", file: "doom_bringer", text: "Демон, который несёт погибель. Он запрещает врагам использовать способности и сжигает их в аду." },
      { name: "Dragon Knight", file: "dragon_knight", text: "Рыцарь, который может превращаться в дракона. Он сражается за свою принцессу и защищает её от всех врагов." },
      { name: "Drow Ranger", file: "drow_ranger", text: "Одинокая лучница из лесных земель. Она стреляет издалека и не подпускает врагов к себе." },
      { name: "Earth Spirit", file: "earth_spirit", text: "Дух земли, который управляет камнями. Он кидает их во врагов и станит их на месте." },
      { name: "Earthshaker", file: "earthshaker", text: "Сын земли, который владеет силой тотема. Он бьёт по земле и вызывает мощное эхо, сбивающее врагов с ног." },
      { name: "Elder Titan", file: "elder_titan", text: "Древний титан, который создал мир. Он использует свою силу, чтобы сокрушить врагов и защитить своё творение." },
      { name: "Ember Spirit", file: "ember_spirit", text: "Дух огня, который любит приключения. Он прыгает по врагам и сжигает их в пламени." },
      { name: "Enchantress", file: "enchantress", text: "Лесная нимфа, которая любит природу. Она подчиняет зверей и лечит своих союзников." },
      { name: "Enigma", file: "enigma", text: "Воплощение пустоты, которое пожирает звёзды. Оно создаёт чёрные дыры и уничтожает всё на своём пути." },
      { name: "Faceless Void", file: "faceless_void", text: "Существо из другого измерения, которое управляет временем. Оно замораживает врагов в зоне и наносит им удары." },
      { name: "Grimstroke", file: "grimstroke", text: "Художник, который рисует смерть. Он связывает врагов магией и наносит им урон." },
      { name: "Gyrocopter", file: "gyrocopter", text: "Пилот, который обожает взрывы. Он стреляет ракетами по площади и разносит врагов на куски." },
      { name: "Hoodwink", file: "hoodwink", text: "Хитрая белка, которая ставит ловушки. Она стреляет из арбалета и сбивает врагов с толку." },
      { name: "Huskar", file: "huskar", text: "Берсерк, который чем больше теряет крови, тем сильнее становится. Он бьёт себя в грудь и кидается в бой." },
      { name: "Invoker", file: "invoker", text: "Величайший маг, который знает 10 заклинаний. Он комбинирует стихии и уничтожает врагов." },
      { name: "Io", file: "wisp", text: "Воплощение света, которое связано с союзниками. Оно лечит их и телепортирует в безопасное место." },
      { name: "Jakiro", file: "jakiro", text: "Двуглавый дракон, который дышит огнём и льдом. Он выжигает врагов и замораживает их." },
      { name: "Juggernaut", file: "juggernaut", text: "Мастер клинка, который крутится в вихре. Он неуязвим в своём ультимейте и рубит врагов на куски." },
      { name: "Keeper of the Light", file: "keeper_of_the_light", text: "Хранитель света, который даёт ману союзникам. Он освещает карту и телепортирует союзников." },
      { name: "Kez", file: "kez", text: "Мастер клинка, который владеет двумя стилями боя. Он быстро переключается и рубит врагов." },
      { name: "Kunkka", file: "kunkka", text: "Адмирал, который бороздит моря. Он вызывает корабль и бьёт врагов бочками." },
      { name: "Legion Commander", file: "legion_commander", text: "Командир легиона, которая ищет славы. Она вызывает врагов на дуэль и получает за это постоянный урон." },
      { name: "Leshrac", file: "leshrac", text: "Тёмный маг, который ломает башни. Он обрушивает на врагов урон по площади." },
      { name: "Lich", file: "lich", text: "Ледяной маг, который любит холод. Он замедляет врагов и пускает в них ледяную сферу." },
      { name: "Lifestealer", file: "life_stealer", text: "Вампир, который пьёт кровь. Он прячется внутри союзников и восстанавливает здоровье." },
      { name: "Lina", file: "lina", text: "Огненная волшебница, сестра Кристал Мейден. Она обожает огонь и сжигает врагов дотла." },
      { name: "Lion", file: "lion", text: "Демон-маг, который крадёт ману. Он станит врагов и убивает их пальцем смерти." },
      { name: "Lone Druid", file: "lone_druid", text: "Одинокий друид, который дружит с медведем. Он управляет им и сражается вместе с ним." },
      { name: "Luna", file: "luna", text: "Лунная всадница, которая бьёт по площади. Она сеет хаос и разрушает врагов." },
      { name: "Lycan", file: "lycan", text: "Оборотень, который призывает волков. Он ломает башни и бежит в бой." },
      { name: "Magnus", file: "magnataur", text: "Магнит, который стягивает врагов. Он собирает их в кучу и наносит удар." },
      { name: "Marci", file: "marci", text: "Девушка с кулаками, которая любит драться. Она прыгает на врагов и кидает их." },
      { name: "Mars", file: "mars", text: "Бог войны, который создаёт арену. Он станит врагов копьём и сражается до конца." },
      { name: "Medusa", file: "medusa", text: "Горгона, которая превращает врагов в камень. Она очень живучая и бьёт по площади." },
      { name: "Meepo", file: "meepo", text: "Маленький гоблин, который делится на копии. Он управляет ими и убивает врагов." },
      { name: "Mirana", file: "mirana", text: "Жрица луны, которая стреляет из лука. Она прячет союзников и станит врагов стрелой." },
      { name: "Monkey King", file: "monkey_king", text: "Король обезьян, который любит драться. Он прыгает с деревьев и бьёт врагов." },
      { name: "Morphling", file: "morphling", text: "Элементаль воды, который меняет атрибуты. Он копирует врагов и уклоняется от ударов." },
      { name: "Muerta", file: "muerta", text: "Мёртвая волшебница, которая стреляет из пистолетов. Она наносит магический урон." },
      { name: "Naga Siren", file: "naga_siren", text: "Сирена, которая управляет иллюзиями. Она усыпляет врагов и разрушает башни." },
      { name: "Nature's Prophet", file: "furion", text: "Пророк природы, который телепортируется по карте. Он ломает башни и призывает лесных духов." },
      { name: "Necrophos", file: "necrolyte", text: "Некромант, который лечится от урона. Он убивает врагов ультимейтом." },
      { name: "Night Stalker", file: "night_stalker", text: "Ночной охотник, который сильнее ночью. Он летает и пугает врагов." },
      { name: "Nyx Assassin", file: "nyx_assassin", text: "Убийца из инвиза, который станит врагов. Он охотится на магов и убивает их." },
      { name: "Ogre Magi", file: "ogre_magi", text: "Глупый огр, который любит магию. Он кидает заклинания и получает случайные мультикасты." },
      { name: "Omniknight", file: "omniknight", text: "Паладин, который лечит и защищает. Он даёт иммунитет к магии." },
      { name: "Oracle", file: "oracle", text: "Провидец, который видит будущее. Он лечит и наносит урон." },
      { name: "Outworld Destroyer", file: "obsidian_destroyer", text: "Разрушитель миров, который ворует интеллект. Он бьёт по площади и уничтожает врагов." },
      { name: "Pangolier", file: "pangolier", text: "Панголин, который катается и сбивает врагов. Он мобильный и весёлый." },
      { name: "Phantom Assassin", file: "phantom_assassin", text: "Убийца, которая наносит криты. Она уклоняется от ударов и убивает одним ударом." },
      { name: "Phantom Lancer", file: "phantom_lancer", text: "Копейщик, который создаёт иллюзии. Он атакует толпой и сбивает врагов с толку." },
      { name: "Phoenix", file: "phoenix", text: "Феникс, который сжигает себя. Он возрождается из пепла и наносит урон по площади." },
      { name: "Primal Beast", file: "primal_beast", text: "Первобытный зверь, который топчет врагов. Он ломает всё на своём пути." },
      { name: "Puck", file: "puck", text: "Фея, которая любит прыгать. Она мобильная и наносит магический урон." },
      { name: "Pudge", file: "pudge", text: "Мясник, который ловит врагов крюком. Он тащит их к себе и убивает." },
      { name: "Pugna", file: "pugna", text: "Маг, который ломает башни. Он отражает магию и лечит союзников." },
      { name: "Queen of Pain", file: "queenofpain", text: "Королева боли, которая любит страдания. Она взрывная и мобильная." },
      { name: "Razor", file: "razor", text: "Электрический дух, который крадёт урон. Он бьёт молниями и уничтожает врагов." },
      { name: "Riki", file: "riki", text: "Невидимый убийца, который любит инвиз. Он бьёт в спину и убивает." },
      { name: "Ringmaster", file: "ringmaster", text: "Цирковой артист, который любит представления. Он контролирует врагов и создаёт зону." },
      { name: "Rubick", file: "rubick", text: "Великий маг, который крадёт заклинания. Он использует способности врагов против них." },
      { name: "Sand King", file: "sand_king", text: "Король песков, который уходит под землю. Он бьёт по площади и станит врагов." },
      { name: "Shadow Demon", file: "shadow_demon", text: "Демон тени, который создаёт иллюзии. Он спасает союзников и наносит урон." },
      { name: "Shadow Fiend", file: "nevermore", text: "Повелитель теней, который собирает души. Он бьёт по площади и убивает врагов." },
      { name: "Shadow Shaman", file: "shadow_shaman", text: "Шаман, который контролирует врагов. Он станит их и ломает башни змеями." },
      { name: "Silencer", file: "silencer", text: "Маг тишины, который запрещает кастовать. Он крадёт интеллект и молчит врагов." },
      { name: "Skywrath Mage", file: "skywrath_mage", text: "Маг небес, который наносит магический урон. Он хрупкий, но очень сильный." },
      { name: "Slardar", file: "slardar", text: "Страж глубин, который снижает броню. Он станит врагов и убивает их." },
      { name: "Slark", file: "slark", text: "Скользкий вор, который крадёт атрибуты. Он убегает и убивает одиночных врагов." },
      { name: "Snapfire", file: "snapfire", text: "Бабушка с печеньками, которая любит взрывы. Она стреляет печеньками и ездит на жабе." },
      { name: "Sniper", file: "sniper", text: "Снайпер, который стреляет издалека. Он очень хрупкий, но наносит много урона." },
      { name: "Spectre", file: "spectre", text: "Призрак, который прыгает на врагов. Она очень сильная в поздней игре." },
      { name: "Spirit Breaker", file: "spirit_breaker", text: "Дух-разрушитель, который бегает по карте. Он станит врагов и ломает их планы." },
      { name: "Storm Spirit", file: "storm_spirit", text: "Дух шторма, который летает на мане. Он очень мобильный и наносит урон." },
      { name: "Sven", file: "sven", text: "Рыцарь, который наносит огромный урон. Он бьёт по площади и убивает всех." },
      { name: "Techies", file: "techies", text: "Безумный изобретатель, который ставит мины. Он взрывает врагов и веселится." },
      { name: "Templar Assassin", file: "templar_assassin", text: "Убийца, которая прячется в щите. Она бьёт с руки и наносит много урона." },
      { name: "Terrorblade", file: "terrorblade", text: "Демон, который меняет здоровье. Он создаёт иллюзии и убивает врагов." },
      { name: "Tidehunter", file: "tidehunter", text: "Морской охотник, который вызывает волны. Он станит врагов и решает драки." },
      { name: "Timbersaw", file: "shredder", text: "Безумный механик, который рубит деревья. Он наносит много урона и очень живучий." },
      { name: "Tinker", file: "tinker", text: "Гений, который перезаряжает предметы. Он прыгает и наносит урон." },
      { name: "Tiny", file: "tiny", text: "Каменный гигант, который кидает врагов. Он очень сильный и ломает башни." },
      { name: "Treant Protector", file: "treant", text: "Древний защитник леса, который лечит союзников. Он станит врагов вокруг деревьев." },
      { name: "Troll Warlord", file: "troll_warlord", text: "Вождь троллей, который быстро бьёт. Он ломает башни и убивает врагов." },
      { name: "Tusk", file: "tusk", text: "Суровый воин, который кидает врагов. Он станит их и создаёт стену." },
      { name: "Underlord", file: "abyssal_underlord", text: "Повелитель преисподней, который открывает портал. Он усиливает союзников и убивает врагов." },
      { name: "Undying", file: "undying", text: "Бессмертный, который ставит гроб. Он ворует силу и убивает врагов." },
      { name: "Ursa", file: "ursa", text: "Медведь, который быстро убивает. Он наносит много урона и рвёт врагов на куски." },
      { name: "Vengeful Spirit", file: "vengefulspirit", text: "Дух мести, который меняется местами. Она спасает союзников и убивает врагов." },
      { name: "Venomancer", file: "venomancer", text: "Ядовитый маг, который травит врагов. Он замедляет их и убивает." },
      { name: "Viper", file: "viper", text: "Змей, который травит врагов. Он не даёт им убежать и убивает их." },
      { name: "Visage", file: "visage", text: "Повелитель птиц, который управляет ими. Он наносит много урона и убивает врагов." },
      { name: "Void Spirit", file: "void_spirit", text: "Дух пустоты, который прыгает между точками. Он уклоняется и наносит урон." },

      { name: "Witch Doctor", file: "witch_doctor", text: "Знахарь, который лечит и крутит ульт. Он наносит много урона и убивает врагов." },
      { name: "Wraith King", file: "skeleton_king", text: "Король призраков, который воскресает. Он очень простой и сильный." },

    ];

    const urlParams = new URLSearchParams(window.location.search);
    const heroName = urlParams.get('hero');

    if (heroName) {
      const decodedName = decodeURIComponent(heroName);
      document.getElementById('hero-name').innerText = decodedName;
      document.title = `Лор: ${decodedName}`;

      const heroData = loreDatabase.find(h => h.name === decodedName);

      if (heroData) {
        const paragraphs = heroData.text.split('. ').filter(p => p.trim() !== '');
        let formattedText = paragraphs.map(p => `<p class="lore-paragraph">${p}.</p>`).join('');
        document.getElementById('hero-lore-content').innerHTML = formattedText;
        
        const imgUrl = `https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/${heroData.file}.png`;
        const imgElement = document.getElementById('hero-img');
        imgElement.src = imgUrl;
        
        imgElement.onerror = function() {
          this.src = 'https://via.placeholder.com/400x400?text=Нет+фото';
        };
      } else {
        document.getElementById('hero-lore-content').innerHTML = `<p>Лор для этого героя пока не написан.</p>`;
      }
    } else {
      document.getElementById('hero-name').innerText = "Неизвестный герой";
    }
  </script>
